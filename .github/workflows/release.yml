name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  release:
    name: Build Windows Release
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10.12.3
          run_install: false

      - name: Get pnpm store directory
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: windows-${{ runner.arch }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: windows-${{ runner.arch }}-pnpm-store-

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Build Tauri App (Windows NSIS)
        run: pnpm tauri build --bundles nsis --config src-tauri/tauri.windows.release-no-updater.json

      - name: Prepare Windows Assets
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          $version = $env:GITHUB_REF_NAME

          $nsis = Get-ChildItem -Path 'src-tauri/target/release/bundle/nsis' -Recurse -Include *setup.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($null -eq $nsis) {
            $nsis = Get-ChildItem -Path 'src-tauri/target/release/bundle' -Recurse -Include *setup.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          }
          if ($null -eq $nsis) {
            throw 'No Windows NSIS installer found'
          }
          Copy-Item $nsis.FullName (Join-Path 'release-assets' "CC-Switch-$version-Windows-Setup.exe")

          $exeCandidates = @(
            'src-tauri/target/release/cc-switch.exe',
            'src-tauri/target/x86_64-pc-windows-msvc/release/cc-switch.exe'
          )
          $exePath = $exeCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if ($null -eq $exePath) {
            throw 'Portable exe not found'
          }

          $portableDir = 'release-assets/CC-Switch-Portable'
          New-Item -ItemType Directory -Force -Path $portableDir | Out-Null
          Copy-Item $exePath $portableDir
          @(
            '# CC Switch portable build marker',
            'portable=true'
          ) | Set-Content -Path (Join-Path $portableDir 'portable.ini') -Encoding UTF8

          Compress-Archive -Path "$portableDir/*" -DestinationPath "release-assets/CC-Switch-$version-Windows-Portable.zip" -Force
          Remove-Item -Recurse -Force $portableDir

      - name: List prepared assets
        shell: pwsh
        run: Get-ChildItem release-assets | Format-Table Name, Length, LastWriteTime

      - name: Upload release artifacts to workflow
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-windows
          path: release-assets/*
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-22.04
    needs: release
    permissions:
      contents: write

    steps:
      - name: Download built release artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-assets-windows
          path: release-assets

      - name: List downloaded release artifacts
        run: ls -la release-assets

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: CC Switch ${{ github.ref_name }}
          prerelease: true
          body: |
            ## CC Switch ${{ github.ref_name }}

            Windows-only release.

            ### Downloads

            - `CC-Switch-${{ github.ref_name }}-Windows-Setup.exe`
            - `CC-Switch-${{ github.ref_name }}-Windows-Portable.zip`

            This release skips updater signatures and does not publish `latest.json`.
          files: release-assets/*
